<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Calidad de Agua para Mantenimiento de Paneles Solares - UNACIFOR</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="site-nav" id="site-nav">
    <a href="#hero" class="nav-brand">UNACIFOR</a>
    
    <div class="nav-controls">
      <!-- Toggle de Tema con Íconos -->
      <label class="theme-switch" for="checkbox-theme" aria-label="Cambiar modo claro u oscuro">
        <input type="checkbox" id="checkbox-theme" />
        <span class="slider">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </span>
      </label>

      <!-- Botón Menú Móvil -->
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <ul class="nav-links" id="nav-links">
      <li><a href="#mecanismo">El mecanismo</a></li>
      <li><a href="#problema">El problema</a></li>
      <li><a href="#metodologia">Metodología</a></li>
      <li><a href="#resultados">Resultados</a></li>
      <li><a href="#galeria">Galería</a></li>
      <li><a href="#conclusion">Conclusión</a></li>
      <li><a href="#equipo">Equipo</a></li>
    </ul>
  </nav>

  <!-- SECCIÓN MECANISMO (SVG ANIMADO CON CICLO METEOROLÓGICO) -->
  <section id="mecanismo" style="padding: 2rem 1rem; max-width: 800px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 1rem;">Mecanismo de Incrustación y Punto Caliente</h2>
    
    <svg id="panel-svg" width="100%" viewBox="0 0 700 450" role="img" aria-label="Simulación de lluvia, evaporación y sarro">
      <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#092B2B"/>
          <stop offset="100%" stop-color="#0D4F4F"/>
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF3C4"/>
          <stop offset="30%" stop-color="#B4881B"/>
          <stop offset="100%" stop-color="#B4881B" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="panelGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E4857"/>
          <stop offset="50%" stop-color="#122E3B"/>
          <stop offset="100%" stop-color="#081820"/>
        </linearGradient>

        <radialGradient id="hotspotGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FF4D4D" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#AB3428" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Fondo -->
      <rect x="0" y="0" width="700" height="450" rx="8" fill="url(#bgGrad)"/>

      <!-- Sol -->
      <g class="sun-system">
        <circle cx="580" cy="70" r="60" fill="url(#sunGlow)"/>
        <circle cx="580" cy="70" r="22" fill="#FFF3C4"/>
      </g>

      <!-- Nubes pasando -->
      <g class="cloud-group">
        <path d="M 200 70 Q 220 40 260 50 Q 290 30 330 50 Q 360 40 380 70 Q 400 90 370 110 L 200 110 Z" fill="#526E7B" opacity="0.85"/>
      </g>

      <!-- Gotas de Lluvia -->
      <g class="rain-group">
        <line x1="250" y1="90" x2="245" y2="110" stroke="#4DA3FF" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="290" y1="80" x2="285" y2="105" stroke="#4DA3FF" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="330" y1="95" x2="325" y2="120" stroke="#4DA3FF" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Panel Solar 3D -->
      <g id="panel-structure">
        <polygon points="80,310 540,310 640,190 180,190" fill="#8A9A86"/>
        <polygon points="90,304 532,304 630,196 188,196" fill="url(#panelGlassGrad)"/>
        
        <g stroke="#1A7A7A" stroke-width="1.2" opacity="0.6">
          <line x1="198" y1="304" x2="296" y2="196"/><line x1="306" y1="304" x2="404" y2="196"/><line x1="414" y1="304" x2="512" y2="196"/>
          <line x1="115" y1="277" x2="556" y2="277"/><line x1="140" y1="250" x2="581" y2="250"/><line x1="165" y1="223" x2="606" y2="223"/>
        </g>
      </g>

      <!-- Gota residual en evaporación -->
      <circle class="drop-main" cx="350" cy="235" r="9" fill="#378ADD" opacity="0.9"/>

      <!-- Cristales de Sarro (CaCO3) -->
      <g class="crystal-layer">
        <ellipse cx="350" cy="245" rx="50" ry="16" fill="#F7F4F0" opacity="0.9" stroke="#B4881B" stroke-width="1.5"/>
      </g>

      <!-- Hotspot sobre la celda -->
      <g class="hotspot-layer">
        <ellipse cx="350" cy="245" rx="60" ry="22" fill="url(#hotspotGlow)"/>
        <text x="350" y="295" text-anchor="middle" fill="#FF6B6B" font-size="13" font-weight="bold">⚠️ PUNTO CALIENTE (HOTSPOT)</text>
      </g>
    </svg>
  </section>

  <!-- LIGHTBOX / VISOR DE GALERÍA -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Cerrar imagen">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Imagen anterior">❮</button>
    <img id="lightbox-img" src="" alt="Vista ampliada">
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Imagen siguiente">❯</button>
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
